<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aftertone — дневник атмосферы дня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
@property --bg{syntax:'<color>';inherits:true;initial-value:#131313}
@property --low{syntax:'<color>';inherits:true;initial-value:#1b1b1b}
@property --cont{syntax:'<color>';inherits:true;initial-value:#1f1f1f}
@property --high{syntax:'<color>';inherits:true;initial-value:#2a2a2a}
@property --highest{syntax:'<color>';inherits:true;initial-value:#353535}
@property --on{syntax:'<color>';inherits:true;initial-value:#e2e2e2}
@property --onv{syntax:'<color>';inherits:true;initial-value:#c4c7c8}
@property --outline{syntax:'<color>';inherits:true;initial-value:#8e9192}
@property --outv{syntax:'<color>';inherits:true;initial-value:#444748}
@property --primary{syntax:'<color>';inherits:true;initial-value:#ffffff}
@property --on-primary{syntax:'<color>';inherits:true;initial-value:#2f3131}
@property --aura{syntax:'<color>';inherits:true;initial-value:#c6c6c7}
:root{--bg:#131313;--lowest:#0e0e0e;--low:#1b1b1b;--cont:#1f1f1f;--high:#2a2a2a;--highest:#353535;--on:#e2e2e2;--onv:#c4c7c8;--outline:#8e9192;--outv:#444748;--primary:#fff;--on-primary:#2f3131;--aura:#c6c6c7;--err:#ffb4ab;
--head:'Montserrat',system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif}
html{background:var(--bg);transition:--bg 1.6s ease,--low 1.6s ease,--cont 1.6s ease,--high 1.6s ease,--highest 1.6s ease,--on 1.6s ease,--onv 1.6s ease,--outline 1.6s ease,--outv 1.6s ease,--primary 1.6s ease,--on-primary 1.6s ease,--aura 1.6s ease}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--on);font:400 15px/20px var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;left:50%;top:-220px;width:900px;height:640px;transform:translateX(-50%);background:radial-gradient(closest-side,color-mix(in oklab,var(--aura) 45%,transparent),transparent);pointer-events:none;z-index:0;transition:background 1.6s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;width:1em;height:1em;overflow:hidden;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex:none;vertical-align:middle}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;padding:0 20px 120px}
.top{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;justify-content:space-between;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);margin:0 -20px;padding:0 20px}
.brand{font:700 15px var(--head);letter-spacing:.32em;color:var(--primary)}
.top .l{display:flex;align-items:center;gap:6px;font:600 17px/22px var(--head);color:var(--primary)}
.ibtn{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--on)}
.ibtn.solid{background:var(--primary);color:var(--on-primary);width:36px;height:36px}
.ibtn:active{opacity:.8}
.sheet{position:absolute;right:20px;top:52px;background:var(--high);border:1px solid var(--outv);border-radius:16px;padding:16px;width:280px;z-index:40;font-size:13px;line-height:18px;color:var(--onv)}
.sheet .btn{margin-top:12px;width:100%}
.stack{display:flex;flex-direction:column;gap:24px;padding-top:8px}
.h-dl{font:700 28px/34px var(--head);letter-spacing:-.01em;color:var(--primary);margin:0}
.h-lg{font:600 24px/30px var(--head);letter-spacing:-.01em;color:var(--primary);margin:0}
.h-md{font:600 20px/25px var(--head);color:var(--primary);margin:0}
.h-sm{font:600 17px/22px var(--head);letter-spacing:-.005em;color:var(--primary);margin:0}
.b-md{font:400 15px/20px var(--body);color:var(--onv);margin:0}
.b-sm{font:400 13px/18px var(--body);color:var(--onv);margin:0}
.lb-md{font:500 12px/16px var(--body)}
.lb-sm{font:600 10px/12px var(--body);letter-spacing:.06em}
.up{text-transform:uppercase;letter-spacing:.12em}
.mut{color:var(--onv)}.out{color:var(--outline)}.pri{color:var(--primary)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--high);color:var(--on);font:600 10px/12px var(--body);letter-spacing:.04em}
.dot{width:6px;height:6px;border-radius:999px;background:var(--aura);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.card{background:var(--low);border-radius:16px;padding:16px}
.card.c2{background:var(--cont)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:999px;background:var(--primary);color:#000;font:600 15px var(--head);transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--primary);border:1px solid var(--outv)}
.btn.sec:hover{background:var(--cont)}
.btn.sm{height:40px;padding:0 16px;font-size:13px}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--cont);color:var(--onv);font:500 13px var(--body);white-space:nowrap}
.chip.on{background:var(--primary);color:#000}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.field{width:100%;height:48px;border-radius:10px;background:var(--cont);border:1px solid transparent;color:var(--on);font:400 15px var(--body);padding:0 14px;outline:none}
.field:focus{border-color:var(--primary)}
.field::placeholder,textarea::placeholder{color:var(--outline)}
.search{position:relative}.search .ms{position:absolute;left:12px;top:14px;color:var(--outline)}.search .field{padding-left:42px}
.err{color:var(--err);font:500 12px/16px var(--body);margin:6px 0 0}.err:empty{display:none}
.fade-in{animation:fi .45s ease both}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
/* главная */
.capture{display:flex;align-items:center;justify-content:space-between;gap:16px}
.capture .ibtn{width:48px;height:48px;background:var(--primary);color:#000}
.feat{background:var(--cont);border-radius:16px;overflow:hidden}
.feat .media{position:relative;aspect-ratio:4/3;background:var(--high)}
.feat canvas{width:100%;height:100%;display:block}
.feat .media::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--cont),color-mix(in oklab,var(--cont) 20%,transparent) 40%,transparent)}
.ovl{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:color-mix(in oklab,var(--lowest) 80%,transparent);backdrop-filter:blur(12px);color:var(--primary);font:600 10px/12px var(--body);letter-spacing:.02em;max-width:calc(100% - 24px)}
.ovl span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovl .ms{font-size:14px}
.feat .body{padding:16px;display:flex;flex-direction:column;gap:8px}
.mini{display:flex;align-items:center;justify-content:space-between;background:var(--low);padding:10px;border-radius:8px;margin-top:4px}
.mini .ibtn{width:36px;height:36px;background:var(--primary);color:#000}
.wave{display:flex;align-items:center;gap:2px;height:24px}.wave i{width:2px;border-radius:2px;background:var(--aura);display:block}
.moods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mood{background:var(--low);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.bar{height:4px;background:var(--highest);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--aura);border-radius:4px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:16px;padding:12px;border-radius:16px;background:var(--cont);transition:background .2s}
.item:hover{background:var(--high)}
.item img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--highest);flex:none}
.item .t{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* дневник */
.dcard{background:var(--cont);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.dcard .cov{border-radius:10px;overflow:hidden;aspect-ratio:16/9;margin-bottom:4px}
.dcard .cov img{width:100%;height:100%;object-fit:cover;display:block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 a img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;display:block;background:var(--high)}
.seg{display:inline-flex;background:var(--cont);border-radius:999px;padding:3px}.seg button{width:38px;height:30px;border-radius:999px;color:var(--outline);display:inline-flex;align-items:center;justify-content:center}.seg button.on{background:var(--highest);color:var(--primary)}
/* создание */
.steps{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px}
.steps::-webkit-scrollbar{display:none}
.step{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);color:var(--outline);white-space:nowrap}
.step b{width:24px;height:24px;border-radius:999px;background:var(--high);color:var(--onv);display:inline-flex;align-items:center;justify-content:center;font:600 12px var(--body)}
.step.on{color:var(--primary)}.step.on b{background:var(--primary);color:#000}
.step.done b{background:var(--aura);color:#000}
.steps hr{width:14px;border:0;border-top:1px solid var(--outv);margin:0;flex:none}
.datepill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:var(--cont);font:600 13px var(--body);color:var(--on);position:relative}
.datepill input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.ta{background:var(--cont);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid transparent}
.ta:focus-within{border-color:var(--outv)}
.ta textarea{background:transparent;border:0;outline:none;resize:none;color:var(--on);font:400 17px/24px var(--body);min-height:150px;width:100%}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;aspect-ratio:1/1.12;border-radius:16px;overflow:hidden;background:var(--cont);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font:600 13px var(--body);color:var(--on);cursor:pointer}
.tile.ghost{background:var(--lowest);color:var(--outline);font-weight:400}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .main{position:absolute;left:8px;bottom:8px;background:color-mix(in oklab,#000 55%,transparent);color:#fff;font:600 10px var(--body);padding:3px 7px;border-radius:6px}
.tile .x{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:999px;background:color-mix(in oklab,#000 60%,transparent);color:#fff;display:flex;align-items:center;justify-content:center}
.tile .x .ms{font-size:16px}
.music{background:var(--cont);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.music .hd{display:flex;align-items:center;gap:14px}
.music .ic{width:48px;height:48px;border-radius:10px;background:var(--high);display:flex;align-items:center;justify-content:center;flex:none;color:var(--primary)}
.music .field,.music .chip:not(.on){background:var(--high)}
.k{font:600 10px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--outline);min-width:44px}
.note{font:400 12px/16px var(--body);color:var(--outline);text-align:center;margin:10px 0 0}
/* воспоминание */
.poster{border-radius:16px;overflow:hidden;position:relative;background:var(--low)}
.poster canvas{width:100%;height:auto;display:block}
.player{background:var(--cont);border-radius:16px;padding:16px}
.player .ibtn.solid{width:44px;height:44px}
.prog{height:8px;background:var(--highest);border-radius:8px;overflow:hidden;margin-top:12px}.prog i{display:block;height:100%;background:var(--primary);border-radius:8px;width:0}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--cont);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.cell.w{grid-column:1/-1}
.cell .lb{display:flex;align-items:center;gap:8px;color:var(--onv);font:400 13px var(--body)}
.pal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pal div{background:var(--cont);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.pal i{display:block;width:100%;aspect-ratio:1;border-radius:4px}
.pal span{font:500 9.5px var(--body);color:var(--outline);text-transform:uppercase}
.sl{display:grid;grid-template-columns:96px 1fr 30px;gap:12px;align-items:center;font:500 12px var(--body);color:var(--onv);margin:6px 0}
.sl b{font-weight:600;color:var(--primary);text-align:right}
input[type=range]{width:100%;accent-color:var(--primary)}
.rules{list-style:none;margin:0;padding:0}
.rules li{padding:10px 0 10px 26px;position:relative;border-top:1px solid var(--outv);font:400 13px/18px var(--body);color:var(--on)}
.rules li:first-child{border-top:0}
.rules li .ms{position:absolute;left:0;top:10px;font-size:16px;color:var(--aura)}
.files div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--outv);font:400 13px var(--body)}
.files div:first-child{border-top:0}
.files span:last-child{color:var(--outline);text-align:right}
.quote{font:400 17px/24px var(--body);color:var(--onv);margin:0}
.hand{font-family:'Caveat',cursive;font-size:24px;line-height:28px;color:var(--onv);margin:0}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.extra{display:flex;flex-wrap:wrap;gap:8px}
details summary{cursor:pointer;list-style:none;font:600 12px var(--body);color:var(--outline);margin-top:12px}
details summary::-webkit-details-marker{display:none}
/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 0;text-align:center}
.cal .wd{font:600 10px var(--body);color:var(--outline);letter-spacing:.06em;padding-bottom:8px}
.cal .d{height:44px;display:flex;align-items:center;justify-content:center}
.cal .d span{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:500 15px var(--body);color:var(--onv)}
.cal .d.has span{color:#111;font-weight:600;cursor:pointer}
.cal .d.sel span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--primary)}
.cal .d.today span{border:1px solid var(--outline)}
/* капсула */
.lock{display:flex;gap:14px;align-items:flex-start;background:var(--cont);border-radius:16px;padding:16px}
.lock .ic{width:44px;height:44px;border-radius:999px;background:var(--high);display:flex;align-items:center;justify-content:center;flex:none;color:var(--primary)}
.revealed{margin-top:10px;padding:12px;border-radius:10px;background:var(--low)}
/* нижнее меню */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in oklab,var(--lowest) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--low);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;height:64px;display:flex;justify-content:space-around;align-items:center}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10px var(--body);color:var(--outline);min-width:56px}
.tabs a.on{color:var(--primary);font-weight:600}
.tabs a .ms{font-size:24px}
.tabs a.plus{width:52px;height:52px;border-radius:999px;background:var(--primary);color:#000;justify-content:center;min-width:0}
.busy{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:60;text-align:center;padding:24px}
.busy .ring{width:56px;height:56px;border-radius:999px;border:2px solid var(--outv);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--high);border:1px solid var(--outv);color:var(--on);padding:12px 16px;border-radius:12px;font:500 13px/18px var(--body);z-index:70;width:min(520px,90vw)}
.disc{font:400 12px/16px var(--body);color:var(--outline);margin:0}
details.acc{background:var(--low);border-radius:16px}
.imm{position:fixed;inset:0;z-index:90;background:#000;color:#fff;touch-action:none}
.imm canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.imm-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 12px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.45),transparent);z-index:2}
.imm-top .ibtn{color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.imm-btns{display:flex;gap:6px;align-items:center}
.imm .chip{background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(10px);height:32px}
.imm .chip.on{background:#fff;color:#000}
.imm-cap{position:absolute;left:20px;right:20px;bottom:max(32px,env(safe-area-inset-bottom));z-index:2;pointer-events:none;transition:opacity .6s}
.imm-title{font:700 clamp(28px,6vw,48px)/1.08 var(--head);margin:6px 0 8px;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.imm-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);backdrop-filter:blur(10px);padding:12px 18px;border-radius:12px;font:500 14px var(--body);z-index:2;text-align:center;max-width:80vw}
.imm.vr .imm-top{opacity:.35}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:25;pointer-events:none}
.col{display:contents}
.pl{display:none}
@media (min-width:1000px){
  body{padding-left:248px}
  .app{max-width:1180px;padding:0 40px 64px}
  .top{margin:0 -40px;padding:0 40px}
  .tabs{top:0;bottom:0;right:auto;width:248px;border-top:0;border-right:1px solid var(--low);background:var(--lowest)}
  .tabs .in{max-width:none;height:100%;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:72px 16px 24px;gap:4px}
  .tabs a{flex-direction:row;gap:14px;font:500 14px var(--body);padding:11px 14px;border-radius:12px;min-width:0}
  .tabs a.on{background:var(--cont)}
  .tabs a:hover{background:var(--low);color:var(--on)}
  .tabs a .ms{font-size:22px}
  .tabs a.plus{order:-1;width:auto;height:46px;border-radius:999px;justify-content:center;margin-bottom:16px;font:600 14px var(--head);color:#000}
  .tabs a.plus:hover{background:var(--primary);opacity:.9}
  .tabs a.plus.on{background:var(--primary);color:#000}
  .tabs a.plus .pl{display:inline}
  .stack.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start}
  .stack.two.wideL{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .stack.two.dayv{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
  .stack.two>.F{grid-column:1/-1}
  .stack.two>.col{display:flex;flex-direction:column;gap:20px;min-width:0}
  .stack.two>.col.sticky{position:sticky;top:76px}
  .dayv .poster canvas{max-height:calc(100vh - 330px);width:auto;max-width:100%;margin:0 auto}
  .list.d2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .h-dl{font-size:34px;line-height:41px}
  .toast{bottom:24px;left:calc(50% + 124px)}
  .sheet{right:40px}
}
details.acc>summary{list-style:none;cursor:pointer;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;user-select:none;border-radius:16px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:hover{background:var(--cont)}
details.acc>summary>*:first-child{margin:0!important;min-width:0}

/* ---------- тема дня: сцена, погода, место, событие ---------- */

const EVENTS = [['день рожд','День рождения'],['свадьб','Свадьба'],['выпускн','Выпускной'],['концерт','Концерт'],['новый год','Новый год'],['собеседован','Собеседование'],['свидан','Свидание'],['переезд','Переезд'],['поход','Поход'],['путешеств','Путешествие'],['поездк','Поездка']];

const OPEN = {

const CAPTIONS = { 'Тепло':'медленно и тепло', 'Напряжение':'на кофе и упрямстве', 'Радость':'громко и счастливо', 'Грусть':'тихо и немного грустно', 'Ностальгия':'как в детстве', 'Тишина':'тишина, которой хватало', 'Вдохновение':'легко и светло' };
function makeStory(A, v, seed){
  const o = topicOf(A), R = mulberry32(seed || 1), pick = a => a[Math.floor(R() * a.length)], cap = x => x.charAt(0).toUpperCase() + x.slice(1);
  const key = o.firstSnow ? 'firstSnow' : o.weather || (sceneKind(A.raw) === 'party' ? 'party' : null) || A.season || A.tod || 'day';
  const parts = [pick(OPEN[key])];
  const det = [o.place ? o.place[3] : null, o.comp ? o.comp[2] : null, ...o.things.slice(0, 2).map(x => x[2])].filter(Boolean);
  if (det.length) parts.push(cap(det.join(', ')) + '.');
  const contrast = v.textInfo.hits.cold.length && v.textInfo.hits.warm.length;
  if (contrast) parts.push('Снаружи было холодно, а внутри — тепло.');
  const mood = moodOf(v);
  parts.push(pick(CLOSE[mood.short] || CLOSE['Вдохновение']));
  return { description: parts.join(' '), caption: contrast ? 'холодно снаружи, тепло внутри' : CAPTIONS[mood.short] || 'легко и светло' };
}

/* ---------- анализ фото ---------- */
function analyzePhotos(sources){
  const bins = new Map(); let lumSum = 0, chromaSum = 0, warmW = 0, coolW = 0, total = 0;
  const c = document.createElement('canvas'); c.width = c.height = 48; const x = c.getContext('2d', {willReadFrequently:true});
  for (const src of sources){
    x.clearRect(0,0,48,48); x.drawImage(src, 0, 0, 48, 48);
    const d = x.getImageData(0,0,48,48).data;
    for (let i = 0; i < d.length; i += 4){
      const r=d[i], g=d[i+1], b=d[i+2]; const o = rgbToOklch({r,g,b});
      lumSum += o.L; chromaSum += o.C; total++;
      if (o.C > 0.05){ if (o.h > 20 && o.h < 115) warmW += o.C; else if (o.h > 180 && o.h < 300) coolW += o.C; }
      const key = (r>>5)<<6 | (g>>5)<<3 | (b>>5);
      const bin = bins.get(key) || {r:0,g:0,b:0,n:0}; bin.r+=r; bin.g+=g; bin.b+=b; bin.n++; bins.set(key, bin);
    }
  }
  const top = [...bins.values()].sort((a,b) => b.n - a.n).slice(0, 12).map(b => ({r:Math.round(b.r/b.n), g:Math.round(b.g/b.n), b:Math.round(b.b/b.n), n:b.n}));
  let best = top[0], bestScore = -1;
  for (const c of top){ const o = rgbToOklch(c); const sc = c.n * (o.C + 0.02); if (sc > bestScore){ bestScore = sc; best = c; } }
  const bo = rgbToOklch(best);
  const ws = warmW + coolW || 1;
  return {
    colors: top.slice(0, 5).map(hex), hue: bo.h, chroma: bo.C, lum: lumSum/total,
    warm: clamp(0.5 + 0.45*(warmW - coolW)/ws), energy: clamp((chromaSum/total)*5),
    name: hueName(bo.h, bo.C),
  };
}

const GENRES = [
  [['sinatra','синатр','jazz','джаз','swing','свинг'], {genre:'джаз / ретро', bpm:74, energy:0.32, minor:false}],
  [['einaudi','эйнауди','piano','пианино','classical','классик','chopin','шопен'], {genre:'фортепиано', bpm:66, energy:0.2, minor:true}],
  [['lofi','lo-fi','nujabes','chill'], {genre:'lo-fi', bpm:84, energy:0.32, minor:null}],
  [['ambient','эмбиент'], {genre:'эмбиент', bpm:62, energy:0.15, minor:null}],
  [['techno','техно','electro','электро','house','daft punk','edm'], {genre:'электроника', bpm:126, energy:0.85, minor:null}],
  [['rock','рок','metal','punk','панк'], {genre:'рок', bpm:132, energy:0.85, minor:null}],
  [['rap','рэп','hip-hop','хип-хоп','trap'], {genre:'хип-хоп', bpm:92, energy:0.65, minor:null}],
  [['pop','поп','dua lipa','levitating','dance'], {genre:'поп', bpm:118, energy:0.75, minor:false}],

const TEMPO_CHIP = { slow:{bpm:70, energy:0.28}, mid:{bpm:100, energy:0.55}, fast:{bpm:128, energy:0.82} };
function musicFromLink(url, label, tempo, mode){
  const s = (label + ' ' + url).toLowerCase();
  let meta = {genre:null, bpm:100, energy:0.5, minor:null};
  for (const [keys, m] of GENRES) if (keys.some(k => s.includes(k))) { meta = {...m}; break; }
  if (tempo && TEMPO_CHIP[tempo]) Object.assign(meta, TEMPO_CHIP[tempo]);
  if (mode === 'minor') meta.minor = true; else if (mode === 'major') meta.minor = false;
  let service = 'ссылка', embed = null;
  const sp = url.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist)\/([A-Za-z0-9]+)/);
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|music\.youtube\.com\/watch\?v=)([\w-]{11})/);
  if (/spotify/.test(url)) service = 'Spotify'; else if (/youtu/.test(url)) service = 'YouTube'; else if (/yandex/.test(url)) service = 'Яндекс Музыка'; else if (/apple/.test(url)) service = 'Apple Music'; else if (/soundcloud/.test(url)) service = 'SoundCloud';
  if (sp) embed = `https://open.spotify.com/embed/${sp[1]}/${sp[2]}`;
  if (yt) embed = `https://www.youtube.com/embed/${yt[1]}`;
  return { source:'link', url, label: label || service, service, embed, tempoChip: tempo || null, ...meta };
}
async function analyzeAudioFile(file){
  const buf = await file.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC();
  const audio = await ac.decodeAudioData(buf); ac.close();
  const sr = audio.sampleRate, ch = audio.getChannelData(0);
  const from = audio.duration > 50 ? Math.floor(sr*20) : 0, to = Math.min(ch.length, from + sr*30);
  const hop = 512, env = [];
  let sumSq = 0;
  for (let i = from; i + hop < to; i += hop){ let e = 0; for (let j = 0; j < hop; j++){ const v = ch[i+j]; e += v*v; } sumSq += e; env.push(Math.sqrt(e/hop)); }
  const onset = env.map((v,i) => i ? Math.max(0, v - env[i-1]) : 0);
  const fps = sr / hop; let best = 100, bestV = -1;
  for (let bpm = 60; bpm <= 180; bpm++){
    const lag = Math.round(60 * fps / bpm); let v = 0;
    for (let i = lag; i < onset.length; i++) v += onset[i] * onset[i-lag];
    if (v > bestV){ bestV = v; best = bpm; }
  }
  if (best > 160) best = Math.round(best/2);
  const rms = Math.sqrt(sumSq / Math.max(1, (to-from)));
  const name = file.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ');
  return { source:'file', label:name, service:'аудиофайл', bpm:best, energy:clamp(rms*4.2), minor:null, genre:null };
}

/* ---------- вайб: сведение текста, фото и музыки ---------- */
function combine(T, P, M){
  const mTempo = clamp((M.bpm - 60) / 100);
  const mWarm = M.minor === true ? 0.32 : M.minor === false ? 0.62 : 0.5;
  return {
    warmth: clamp(0.55*T.scales.warmth + 0.30*P.warm + 0.15*mWarm),
    energy: clamp(0.45*T.scales.energy + 0.20*P.energy + 0.35*M.energy),
    tension: clamp(0.8*T.scales.tension + 0.2*(M.energy > 0.7 ? (M.minor ? 0.8 : 0.5) : 0.15)),
    tempo: clamp(0.25*T.scales.energy + 0.75*mTempo),
    sadness: T.scales.sadness,
  };
}
const TECH = {
  monet:{name:'Моне', what:'мазки и свет', why:'тепло и неспешно → мазки и мягкий свет в духе Клода Моне'},
  kandinsky:{name:'Кандинский', what:'геометрия', why:'напряжение и быстрый ритм → геометрия линий и пятен в духе Кандинского'},
  film:{name:'плёнка', what:'зерно и засвет', why:'воспоминание о прошлом → плёночное зерно, тёплый засвет, полароид'},
  minimal:{name:'минимализм', what:'пустота и воздух', why:'тишина и мало энергии → японский минимализм: много пустоты вокруг кадра'},
  riso:{name:'ризограф', what:'растр и пятна', why:'праздник и много энергии → ризо-печать: растр, яркие пятна, сдвиг слоёв'},
};
function finalize(v){
  const s = v.scales, M = v.music, P = v.photo, T = v.textInfo;
  let tech;
  if (s.tension > 0.6 && s.energy > 0.45) tech = 'kandinsky';
  else if (s.energy > 0.65 && s.tension < 0.5 && s.warmth > 0.45) tech = 'riso';
  else if (T.nostalgia) tech = 'film';
  else if (s.energy < 0.4 && (s.warmth < 0.48 || s.sadness > 0.25)) tech = 'minimal';
  else if (s.warmth > 0.55) tech = 'monet';
  else tech = 'film';
  const dark = s.tension > 0.55 || T.tod === 'night' || (P.lum < 0.56) || (s.sadness > 0.3 && P.lum < 0.62);
  const mode = dark ? 'dark' : 'light';
  const frameDur = clamp(60 / M.bpm * 8, 2.2, 7);
  const cut = s.tempo > 0.6 ? 'cut' : 'fade';
  const air = clamp((1 - s.energy) * (M.minor ? 1.25 : 1));
  const voice = { rate: +(0.82 + s.energy*0.36 + s.tempo*0.08).toFixed(2), pitch: +(0.92 + s.warmth*0.16 - s.tension*0.08).toFixed(2) };
  voice.label = s.energy < 0.4 ? 'тихий, медленный, тёплый' : s.energy > 0.65 ? 'живой и быстрый' : s.tension > 0.6 ? 'ровный, собранный' : 'спокойный';
  const rules = [];
  const tempoWord = M.bpm < 85 ? 'медленная' : M.bpm < 112 ? 'средняя по темпу' : 'быстрая';
  rules.push(`песня ${tempoWord} (${M.bpm} bpm${M.minor === true ? ', минор' : M.minor === false ? ', мажор' : ''}${M.genre ? ', ' + M.genre : ''}) → ${cut === 'cut' ? 'резкий монтаж' : 'плавная смена'} кадров каждые ${frameDur.toFixed(1)} с`);
  if (air > 0.5) rules.push(`${M.minor ? 'минорная' : 'спокойная'} музыка и мало энергии → больше воздуха вокруг фото, приглушённая насыщенность`);
  else if (s.energy > 0.65) rules.push('много энергии → насыщенные цвета, кадр почти без полей');
  rules.push(`на фото доминирует ${P.name} → основа палитры; ${P.lum > 0.56 ? 'светлые' : 'тёмные'} кадры${T.tod === 'night' ? ' и ночь в тексте' : ''} → ${mode === 'dark' ? 'тёмная' : 'светлая'} тема сайта`);
  const q = arr => arr.slice(0, 3).map(w => `«${w}»`).join(', ');
  if (T.hits.warm.length && T.hits.cold.length) rules.push(`${q(T.hits.cold)} и ${q(T.hits.warm)} → тёплые акценты на прохладной основе`);
  else if (T.hits.warm.length) rules.push(`${q(T.hits.warm)} → оттенки сдвигаются в тёплую сторону`);
  else if (T.hits.cold.length) rules.push(`${q(T.hits.cold)} → оттенки сдвигаются в холодную сторону`);
  if (T.hits.tension.length) rules.push(`${q(T.hits.tension)} → жёсткая сетка и высокий контраст`);
  rules.push(TECH[tech].why);
  rules.push(`озвучка: голос ${voice.label} (скорость ${voice.rate}, высота ${voice.pitch})`);

  v.swatch = { bg: th.bg, accent: th.accent, ink: th.ink, onAccent: contrast(th.accent, '#111111') > 6 ? '#111111' : '#f4efe6' };

}
function themeFromVibe(v){

  const th = dark ? {
    bg: ok(0.17 + 0.04*s.warmth*(1 - s.tension), 0.012 + 0.022*s.energy, hue),
    surface: ok(0.22, 0.016, hue), ink: ok(0.93, 0.022, hue), muted: ok(0.68, 0.022, hue), line: ok(0.33, 0.02, hue),
    accent: ok(0.76, cA, hue), deep: ok(0.14, 0.03, hue),

    bg: ok(0.955 - 0.025*s.energy, 0.014 + 0.022*s.warmth, hue),
    surface: ok(0.91, 0.02, hue), ink: ok(0.21, 0.025, hue), muted: ok(0.5, 0.02, hue), line: ok(0.83, 0.02, hue),
    accent: ok(0.58, cA, hue), deep: ok(0.2, 0.04, hue),

}
function uiTheme(v){
  const th = themeFromVibe(v), h = th.hue, s = v.scales;
  const c = 0.03 + 0.035*s.energy + 0.015*Math.abs(s.warmth - 0.5)*2 - 0.012*s.sadness;
  const L0 = 0.15 + 0.03*s.energy - 0.02*s.tension;
  return { bg: ok(L0, c, h), lowest: ok(L0 - 0.03, c*0.9, h), low: ok(L0 + 0.045, c*1.05, h), cont: ok(L0 + 0.075, c*1.05, h), high: ok(L0 + 0.125, c, h), highest: ok(L0 + 0.17, c*0.95, h),
    on: ok(0.93, 0.025, h), onv: ok(0.83, 0.035, h), outline: ok(0.68, 0.04, h), outv: ok(0.4, 0.035, h), primary: ok(0.95, 0.04 + 0.03*s.energy, h), 'on-primary': ok(0.22, 0.03, h),
    aura: ok(0.74, clamp(0.11 + 0.12*s.energy - 0.03*s.sadness, 0.08, 0.22), h) };
}
function applyTheme(day){
  const t = uiTheme(day.vibe), r = document.documentElement.style;
  for (const [k, v] of Object.entries(t)) r.setProperty('--' + k, v);
  setFx(day);
  let m = document.querySelector('meta[name=theme-color]'); if (!m){ m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); } m.content = t.bg;
}

/* ---------- ИИ (необязательно) ---------- */
async function analyzeWithAI(payload){
  if (!AI_ENDPOINT) return null;
  try { const r = await fetch(AI_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt:AI_PROMPT, ...payload})}); return r.ok ? await r.json() : null; }
  catch { return null; }
}
async function buildVibe(text, photoSources, music){
  const T = analyzeText(text), P = analyzePhotos(photoSources);
  const ai = await analyzeWithAI({text, photoColors:P.colors, music:{label:music.label, bpm:music.bpm, minor:music.minor, genre:music.genre}});
  if (ai){ if (ai.scales) Object.assign(T.scales, ai.scales); if (typeof ai.nostalgia === 'boolean') T.nostalgia = ai.nostalgia; if (ai.hits) Object.assign(T.hits, ai.hits); }
  const v = { scales: combine(T, P, music), photo: P, music: {bpm:music.bpm, energy:music.energy, minor:music.minor, genre:music.genre},
    textInfo: { hits:{warm:T.hits.warm, cold:T.hits.cold, tension:T.hits.tension}, tod:T.tod, season:T.season, nostalgia:T.nostalgia, scene: sceneKind(T.raw), weather: weatherOf(T.raw) } };
  finalize(v);

  if (ai){ if (ai.title && ai.title.split(' ').length >= 3 && ai.title.split(' ').length <= 7) title = ai.title; if (ai.description) description = ai.description; if (ai.caption) caption = ai.caption.slice(0, 60); }

/* ---------- демо-фото (процедурные «снимки» для демо-дней) ---------- */
const sceneCache = new Map();
function scene(name, seed){
  const key = name + seed; if (sceneCache.has(key)) return sceneCache.get(key);

    x.fillStyle = '#5a3420'; x.fillRect(r(480,620), 700, 60, 70); x.fillStyle = '#7a4a2c'; x.fillRect(r(660,760), 712, 54, 62);
  } else if (name === 'office'){
    grad([[0,'#091121'],[1,'#1b2a45']]);
    for (let b = 0; b < 9; b++){ const bx = b*140 + r(-20,20), bh = r(260,620); x.fillStyle = '#0e1a30'; x.fillRect(bx, H-bh-260, 120, bh);
      for (let wy = H-bh-240; wy < H-280; wy += 26) for (let wx = bx+10; wx < bx+110; wx += 20) if (R() < 0.35){ x.fillStyle = R() < 0.8 ? 'rgba(255,205,110,.75)' : 'rgba(140,190,255,.8)'; x.fillRect(wx, wy, 10, 14); } }
    x.fillStyle = '#05080f'; x.fillRect(0, H-260, W, 260);
    blob(600, 560, 420, '#4d8dff', 0.55);
    x.fillStyle = '#9cc4ff'; x.fillRect(380, 420, 440, 260); x.fillStyle = '#1b2a45'; for (let l = 0; l < 9; l++){ x.fillRect(410, 450 + l*24, r(120,380), 8); }

    x.fillStyle = '#e8e2d6'; x.beginPath(); x.ellipse(900, 760, 40, 14, 0, 0, 7); x.fill(); x.fillRect(860, 700, 80, 60);
  } else if (name === 'rain'){
    grad([[0,'#5b646b'],[1,'#a3abb0']]);
    for (let i = 0; i < 16; i++) blob(r(0,W), r(300,800), r(40,120), R() < 0.5 ? '#f0c27e' : '#bcd0de', 0.35);

    x.fillStyle = '#2f3438'; x.fillRect(0, 0, 26, H); x.fillRect(W-26, 0, 26, H); x.fillRect(W/2-10, 0, 20, H); x.fillRect(0, H-60, W, 60);

/* ---------- раскрывающиеся разделы ---------- */
function accordion(root, openTitles = []){
  for (const sec of $$('.stack section.card', root)){
    const head = sec.firstElementChild; if (!head) continue;
    const title = head.textContent.trim();
    const d = document.createElement('details'); d.className = 'acc'; if (openTitles.some(t => title.startsWith(t))) d.open = true;
    const sum = document.createElement('summary'); sum.appendChild(head);
    sum.insertAdjacentHTML('beforeend', '<span class="ms chev">expand_more</span>');
    const body = document.createElement('div'); body.className = 'acc-b';
    while (sec.firstChild) body.appendChild(sec.firstChild);
    d.append(sum, body); sec.replaceWith(d);
  }
}

let ac;
function recordVideo(canvas, day, btn){
  if (!window.MediaRecorder || !canvas.captureStream){ toast('Запись видео не поддерживается этим браузером'); return; }
  const stream = canvas.captureStream(30), a = $('#player audio');
  if (!a && SOUND && BUS){ const dest = AC.createMediaStreamDestination(); BUS.connect(dest); dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr)); }
  if (a){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (!a._src){ a._src = ac.createMediaElementSource(a); a._src.connect(ac.destination); } const dest = ac.createMediaStreamDestination(); a._src.connect(dest); dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr)); a.currentTime = 0; a.play(); } catch (err) { console.warn(err); } }
  const type = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(stream, type ? {mimeType: type} : undefined), chunks = [], lab = $('span:last-child', btn);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const blob = new Blob(chunks, {type: rec.mimeType}); const l = document.createElement('a'); l.download = day.title + (rec.mimeType.includes('mp4') ? '.mp4' : '.webm'); l.href = URL.createObjectURL(blob); l.click(); lab.textContent = 'Видео 15 с'; btn.disabled = false; };
  rec.start(); btn.disabled = true; let left = 15; lab.textContent = `Запись ${left} с`;
  const iv = setInterval(() => { left--; lab.textContent = `Запись ${left} с`; if (left <= 0){ clearInterval(iv); rec.stop(); } }, 1000);
  if (!a && !SOUND) toast('Чтобы в видео был звук, сначала включите саундтрек дня.');
}

    <section class="card"><div class="row" style="margin-bottom:12px"><button class="ibtn" id="mP" aria-label="Предыдущий месяц">${ms('chevron_left')}</button><span class="h-sm">${MONTHS_NOM[mo-1]} ${y}</span><button class="ibtn" id="mN" aria-label="Следующий месяц">${ms('chevron_right')}</button></div><div class="cal" id="cal">${cells}</div></section>
    </div><div class="col">
    ${selDay ? `<section class="card c2"><span class="lb-sm up mut">${fmtLong(selDay.date)}</span><h2 class="h-lg" style="margin:6px 0 12px">${esc(selDay.title)}</h2>
      <div class="row" style="justify-content:flex-start;gap:10px;margin-bottom:8px"><span class="ms" style="color:var(--onv)">${mood.icon}</span><span class="b-md">${mood.label}</span></div>
      <div class="row" style="justify-content:flex-start;gap:10px;margin-bottom:16px"><span class="ms" style="color:var(--onv)">music_note</span><div style="min-width:0"><div class="lb-md out">Саундтрек дня</div><div class="b-md trunc" style="color:var(--on)">${esc(selDay.music.label)}</div></div></div>
      <a class="btn w" href="#/day/${selDay.id}">Открыть воспоминание ${ms('arrow_forward')}</a></section>`
    : `<section class="card c2" style="text-align:center"><p class="b-md" style="margin-bottom:12px">${calSel ? 'В этот день записи нет' : 'В этом месяце пока нет записей'}</p><a class="btn sec sm" href="#/new">Записать день</a></section>`}
    ${inMonth.length > 1 ? `<section><div class="h-sm" style="margin-bottom:8px">Другие дни в ${MONTHS_PREP[mo-1]}</div><div class="list">${inMonth.filter(d => d !== selDay).reverse().map(d => `<a class="item" href="#/day/${d.id}"><div style="width:52px;text-align:center;flex:none"><div class="h-sm">${+d.date.slice(8)}</div><div class="lb-md out">${MONTHS[mo-1].slice(0,3)}</div></div><div class="t"><span class="h-sm trunc" style="font-size:15px">${esc(d.title)}</span><span class="b-sm">${moodOf(d.vibe).label}</span></div>${ms('chevron_right')}</a>`).join('')}</div></section>` : ''}
    </div>
  </div>`;
  const shift = k => { const d = new Date(y, mo - 1 + k, 1); calMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; viewCalendar(); };
  $('#mP').onclick = () => shift(-1); $('#mN').onclick = () => shift(1);
  $('#cal').onclick = e => { const c = e.target.closest('.d[data-iso]'); if (!c) return; calSel = c.dataset.iso; viewCalendar(); };
}

/* ---------- капсула времени ---------- */
const CKEY = 'aftertone.capsules.v1';
let CAPS = [];
function saveCaps(){ if (!storageOK) return; try { localStorage.setItem(CKEY, JSON.stringify(CAPS)); } catch {} }
function seedCapsules(force){
  let st = null; if (!force){ try { st = JSON.parse(localStorage.getItem(CKEY) || 'null'); } catch {} }
  if (st) { CAPS = st; return; }
  const t = todayISO(), [yy] = t.split('-').map(Number);
  CAPS = [
    { id:'c1', created:'2026-11-08', open:`${yy + 1}-05-08`, text:'Письмо из осеннего парка. Помни, как было холодно и как грело какао. Если сейчас тяжело — выйди погулять, листья всегда возвращаются.', music:'Frank Sinatra — Fly Me to the Moon' },
    { id:'c2', created:'2026-05-21', open:t, text:'Шум прибоя в шесть утра, термос с горячим чаем и ощущение, что всё только начинается. Не забывай замедляться.', music:'Ólafur Arnalds — Near Light' },
  ];
  saveCaps();
}
function viewCapsule(){
  setTab('capsule'); topBrand(); applyTheme(latest());
  const t = todayISO(), plus = n => { const d = new Date(); d.setMonth(d.getMonth() + n); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
  const daysTo = iso => Math.round((Date.parse(iso) - Date.parse(t)) / 864e5);
  const caps = [...CAPS].sort((a,b) => a.open < b.open ? -1 : 1);
  app.innerHTML = `<div class="stack fade-in two">
    <section class="F"><div class="row" style="justify-content:flex-start;gap:8px"><h1 class="h-dl">Капсула времени</h1><span class="ms" style="font-size:26px;color:var(--onv)">hourglass_top</span></div><p class="b-md" style="margin-top:4px">Послание себе в будущее. Откроется только в назначенную дату.</p></section>
    <div class="col">
    <section class="card"><div class="row" style="margin-bottom:12px"><span class="h-sm">Создать капсулу</span><span class="pill">Черновик</span></div>
      <div class="ta" style="background:var(--cont)"><textarea id="ct" placeholder="Что ты хочешь сказать себе через полгода?" style="min-height:110px" aria-label="Текст послания"></textarea></div><p class="err" id="e-ct"></p>
      <input class="field" id="cm" placeholder="Саундтрек момента: исполнитель — название" style="margin-top:10px" aria-label="Песня">
      <label class="row card c2" style="margin-top:10px;padding:12px 14px;position:relative"><span class="row" style="gap:10px;justify-content:flex-start">${ms('calendar_today')}<span class="b-md" style="color:var(--on)">Дата открытия</span></span><span class="lb-md mut" id="cdl">${fmtLong(plus(6))}</span><input type="date" id="cd" value="${plus(6)}" min="${plus(0)}" style="position:absolute;inset:0;opacity:0;width:100%;cursor:pointer" aria-label="Дата открытия"></label><p class="err" id="e-cd"></p>
      <button class="btn w" id="seal" style="margin-top:14px">${ms('lock')}Запечатать капсулу</button></section>
    </div><div class="col">
    <section><div class="row" style="margin-bottom:8px"><span class="h-sm">Запечатанные капсулы</span><span class="lb-md out">${caps.length}</span></div>
      <div class="list">${caps.map(c => { const n = daysTo(c.open), ready = n <= 0; return `<div class="lock"><div class="ic">${ms(ready ? 'lock_open' : 'lock')}</div><div style="flex:1;min-width:0">
        <div class="h-sm">${esc(makeTitle(analyzeText(c.text)))}</div><div class="lb-md out" style="margin-top:2px">Создано: ${fmtLong(c.created)}</div>
        <div class="b-sm" style="margin-top:6px;color:${ready ? 'var(--primary)' : 'var(--onv)'}">${ready ? 'Откроется сегодня' : `Откроется ${fmtLong(c.open)} (через ${n} дн.)`}</div>
        ${ready ? `<button class="btn sm" data-open="${c.id}" style="margin-top:10px">${ms('auto_awesome')}Открыть капсулу</button><div class="revealed" id="rv-${c.id}" hidden><p class="quote">«${esc(c.text)}»</p>${c.music ? `<div class="lb-md mut" style="margin-top:8px;display:flex;gap:6px;align-items:center">${ms('music_note')}${esc(c.music)}</div>` : ''}</div>` : ''}</div></div>`; }).join('')}</div></section>
    </div>
  </div>`;
  $('#cd').onchange = e => { $('#cdl').textContent = e.target.value ? fmtLong(e.target.value) : ''; };
  $$('[data-open]').forEach(b => b.onclick = () => { $('#rv-' + b.dataset.open).hidden = false; b.remove(); });
  $('#seal').onclick = () => {
    const text = $('#ct').value.trim(), open = $('#cd').value; let bad = false;
    if (text.length < 10){ $('#e-ct').textContent = 'Напишите послание хотя бы в одно предложение.'; bad = true; } else $('#e-ct').textContent = '';
    if (!open || open <= t){ $('#e-cd').textContent = 'Выберите дату в будущем.'; bad = true; } else $('#e-cd').textContent = '';
    if (bad) return;
    CAPS.push({ id:'c' + Date.now().toString(36), created:t, open, text, music: $('#cm').value.trim() }); saveCaps();
    toast('Капсула запечатана до ' + fmtLong(open)); viewCapsule();
  };
}

/* ---------- навигация ---------- */
let curPath = null;
function go(hash){ curPath = hash; try { if (location.hash !== hash) history.pushState(null, '', hash); } catch {} route(hash); }
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#/"]'); if (!a || e.metaKey || e.ctrlKey) return; e.preventDefault(); go(a.getAttribute('href')); });
async function route(hash){
  hash = hash || location.hash || '#/'; curPath = hash;
  stopAll(); window.scrollTo(0, 0); $('.sheet')?.remove();
  const [, r, id] = (hash.replace(/^#/, '') || '/').split('/');
  if (r === 'new') viewNew();
  else if (r === 'day') await viewDay(id);
  else if (r === 'diary' || r === 'feed') await viewDiary();
  else if (r === 'calendar' || r === 'archive') await viewCalendar();
  else if (r === 'capsule') viewCapsule();
  else await viewHome();
}
(async function init(){
  app.innerHTML = '<div class="busy"><div class="ring"></div><div class="h-md">Открываю дневник</div></div>';
  await Promise.race([Promise.all(['700 40px Montserrat','500 20px Inter','500 30px Caveat','24px "Material Symbols Outlined"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).catch(() => {});
  const stored = load();
  if (stored && stored.length) DAYS = stored; else await seedDemo();
  let migrated = false;
  for (const d of DAYS) if (!d.v2){ const A = analyzeText(d.text); Object.assign(d.vibe.textInfo, { scene: sceneKind(A.raw), weather: weatherOf(A.raw), tod: A.tod, season: A.season }); d.title = makeTitle(A, d.vibe.scales); const st = makeStory(A, d.vibe, hashStr(d.text)); d.description = st.description; d.caption = st.caption; d.v2 = 1; d.rev++; migrated = true; }
  if (migrated) save();
  seedCapsules(false);
  const onNav = () => { if ((location.hash || '#/') !== curPath) route(location.hash); };
  window.addEventListener('hashchange', onNav); window.addEventListener('popstate', onNav);
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  route();
})();
</script>
</body>
</html>
